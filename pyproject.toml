[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-pipeline"
version = "0.1.0"
description = "Silence-aware audio transcription pipeline with interchangeable speech-to-text engines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["transcriber"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["transcriber"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=transcriber --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that invoke ffmpeg on synthetic audio",
]
